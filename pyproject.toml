[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-universe"
version = "0.1.0"
description = "Independent crypto spot-universe comparison toolkit"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = []

[project.scripts]
crypto-universe = "crypto_universe.spot_universe:main"
crypto-universe-binance = "crypto_universe.spot_universe_binance:main"
crypto-universe-bitget = "crypto_universe.spot_universe_bitget:main"
crypto-universe-bitmart = "crypto_universe.spot_universe_bitmart:main"
crypto-universe-bybit = "crypto_universe.spot_universe_bybit:main"
crypto-universe-coinbase = "crypto_universe.spot_universe_coinbase:main"
crypto-universe-coinw = "crypto_universe.spot_universe_coinw:main"
crypto-universe-cryptocom = "crypto_universe.spot_universe_cryptocom:main"
crypto-universe-gate = "crypto_universe.spot_universe_gate:main"
crypto-universe-htx = "crypto_universe.spot_universe_htx:main"
crypto-universe-kucoin = "crypto_universe.spot_universe_kucoin:main"
crypto-universe-mexc = "crypto_universe.spot_universe_mexc:main"
crypto-universe-okx = "crypto_universe.spot_universe_okx:main"
crypto-universe-upbit = "crypto_universe.spot_universe_upbit:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
