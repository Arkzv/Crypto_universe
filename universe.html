<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crypto Universe — Explorer</title>
<style>
*{box-sizing:border-box}
body{font-family:system-ui,-apple-system,sans-serif;margin:0;padding:16px;background:#181a20;color:#e8e8e8;font-size:14px}
a{color:#5b9cf5}
.header{margin-bottom:14px}
.header h1{margin:0 0 4px;font-size:20px}
.header .date{color:#888;font-size:13px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start;margin-bottom:12px}
.bar input,.bar select{background:#23262f;color:#e8e8e8;border:1px solid #333;border-radius:4px;padding:6px 10px;font-size:14px}
.bar input[type=text]{width:220px}
.bar select{width:160px}
.bar label{color:#888;font-size:13px;display:flex;align-items:center;gap:4px}
.bar label input[type=checkbox]{accent-color:#5b9cf5}
.ex-multi{position:relative;display:inline-block}
.ex-btn{background:#23262f;color:#e8e8e8;border:1px solid #333;border-radius:4px;padding:6px 10px;font-size:14px;cursor:pointer;min-width:160px;text-align:left;user-select:none}
.ex-btn::after{content:'\25bc';float:right;font-size:10px;margin-top:2px;color:#888}
.ex-drop{display:none;position:absolute;top:100%;left:0;background:#23262f;border:1px solid #333;border-radius:4px;padding:6px 0;z-index:10;min-width:160px;max-height:280px;overflow-y:auto}
.ex-drop.open{display:block}
.ex-drop label{display:flex;align-items:center;gap:6px;padding:4px 12px;cursor:pointer;font-size:13px;color:#ccc}
.ex-drop label:hover{background:#2a2d35}
.ex-drop .ex-actions{display:flex;gap:8px;padding:4px 12px 6px;border-bottom:1px solid #333;margin-bottom:4px}
.ex-drop .ex-actions a{font-size:12px;cursor:pointer;color:#5b9cf5}
.stats{color:#888;font-size:13px;margin-bottom:10px}
.stats b{color:#c8c8c8}
.wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:5px 10px;border-bottom:1px solid #23262f;white-space:nowrap}
td:last-child{white-space:normal}
th{position:sticky;top:0;background:#1e2028;cursor:pointer;user-select:none;color:#aaa;font-weight:600;font-size:13px}
th:hover{color:#e8e8e8}
th .arrow{font-size:10px;margin-left:3px}
td:nth-child(1){color:#888;text-align:right;width:50px}
td:nth-child(4){text-align:right}
td:nth-child(5){text-align:right}
.venue{display:inline-block;margin:0 2px}
.venue .nm{color:#5b9cf5}
.venue .vol{color:#999}
.venue .pct{color:#e8c84a;font-weight:600}
.venue .sep{color:#444;margin:0 2px}
#loading{text-align:center;padding:60px;color:#888;font-size:16px}
.home{margin-bottom:12px;display:inline-block;font-size:13px}
</style>
</head>
<body>
<a class="home" href="index.html">&larr; Home</a>
<div class="header">
  <h1>Spot Universe — Volume Distribution</h1>
  <div class="date" id="updated"></div>
</div>
<div class="bar">
  <input type="text" id="search" placeholder="Filter pairs (e.g. BTC, ETH/USDT)">
  <div class="ex-multi" id="exMulti">
    <div class="ex-btn" id="exBtn">All exchanges</div>
    <div class="ex-drop" id="exDrop"></div>
  </div>
  <select id="quoteFilter"><option value="">All quotes</option></select>
</div>
<div class="stats" id="stats"></div>
<div id="loading">Loading data&hellip;</div>
<div class="wrap" id="tableWrap" style="display:none">
<table>
<thead><tr>
  <th data-col="idx">#</th>
  <th data-col="pair">Pair</th>
  <th data-col="base">Base</th>
  <th data-col="venues">Venues</th>
  <th data-col="volume">Total Volume</th>
  <th data-col="dist">Volume Distribution</th>
</tr></thead>
<tbody id="tbody"></tbody>
</table>
</div>
<script>
const BATCH=500;
let allRows=[];
let filtered=[];
let sortCol='idx';
let sortAsc=true;
let rendered=0;
let selectedExchanges=new Set();
let allExchanges=[];

function fmtVol(v){
  if(v>=1e9)return (v/1e9).toFixed(1)+'B';
  if(v>=1e6)return (v/1e6).toFixed(1)+'M';
  if(v>=1e3)return (v/1e3).toFixed(1)+'K';
  return v.toFixed(0);
}

function buildDistHTML(venues){
  let h='';
  for(let i=0;i<venues.length;i++){
    const v=venues[i];
    if(i>0)h+='<span class="sep">&middot;</span>';
    h+='<span class="venue"><span class="nm">'+v.exchange+'</span> <span class="vol">'+fmtVol(v.quote_volume)+' '+v.quote_currency+'</span> <span class="pct">'+Math.round(v.volume_pct)+'%</span></span>';
  }
  return h;
}

function renderBatch(){
  const tbody=document.getElementById('tbody');
  const end=Math.min(rendered+BATCH,filtered.length);
  let html='';
  for(let i=rendered;i<end;i++){
    const r=filtered[i];
    html+='<tr><td>'+r._idx+'</td><td>'+r.pair+'</td><td>'+r.base_asset+'</td><td>'+r.venue_count+'</td><td>'+fmtVol(r.total_quote_volume)+' '+r.quote_asset+'</td><td>'+r._distHTML+'</td></tr>';
  }
  tbody.insertAdjacentHTML('beforeend',html);
  rendered=end;
  if(rendered<filtered.length)requestAnimationFrame(renderBatch);
}

function renderTable(){
  const tbody=document.getElementById('tbody');
  tbody.innerHTML='';
  rendered=0;
  filtered.forEach((r,i)=>r._idx=i+1);
  document.getElementById('stats').innerHTML='Showing <b>'+filtered.length+'</b> of <b>'+allRows.length+'</b> pairs';
  renderBatch();
}

function updateExBtn(){
  const btn=document.getElementById('exBtn');
  if(selectedExchanges.size===0||selectedExchanges.size===allExchanges.length)
    btn.textContent='All exchanges';
  else if(selectedExchanges.size<=2)
    btn.textContent=[...selectedExchanges].sort().join(', ');
  else
    btn.textContent=selectedExchanges.size+' exchanges';
}

function applyFilters(){
  const q=document.getElementById('search').value.toUpperCase();
  const qt=document.getElementById('quoteFilter').value;
  const filterEx=selectedExchanges.size>0&&selectedExchanges.size<allExchanges.length;

  filtered=allRows.filter(r=>{
    if(q&&r.pair.indexOf(q)<0)return false;
    if(filterEx){
      let match=false;
      for(const e of selectedExchanges){if(r._exchanges.has(e)){match=true;break;}}
      if(!match)return false;
    }
    if(qt&&r.quote_asset!==qt)return false;
    return true;
  });
  doSort();
}

function doSort(){
  const col=sortCol;
  const asc=sortAsc?1:-1;
  filtered.sort((a,b)=>{
    let va,vb;
    if(col==='pair'||col==='base')va=a[col==='base'?'base_asset':'pair'],vb=b[col==='base'?'base_asset':'pair'];
    else if(col==='venues')va=a.venue_count,vb=b.venue_count;
    else if(col==='volume')va=a.total_quote_volume,vb=b.total_quote_volume;
    else va=0,vb=0;
    if(typeof va==='string')return va<vb?-asc:va>vb?asc:0;
    return (va-vb)*asc;
  });
  renderTable();
}

document.querySelectorAll('th').forEach(th=>{
  th.addEventListener('click',()=>{
    const col=th.dataset.col;
    if(col==='idx'||col==='dist')return;
    if(sortCol===col)sortAsc=!sortAsc;else{sortCol=col;sortAsc=true;}
    document.querySelectorAll('th .arrow').forEach(a=>a.textContent='');
    th.querySelector('.arrow').textContent=sortAsc?' \u25b2':' \u25bc';
    doSort();
  });
  th.insertAdjacentHTML('beforeend','<span class="arrow"></span>');
});

['search','quoteFilter'].forEach(id=>
  document.getElementById(id).addEventListener(id==='search'?'input':'change',applyFilters));

// Exchange multiselect dropdown
document.getElementById('exBtn').addEventListener('click',e=>{
  e.stopPropagation();
  document.getElementById('exDrop').classList.toggle('open');
});
document.addEventListener('click',()=>document.getElementById('exDrop').classList.remove('open'));
document.getElementById('exDrop').addEventListener('click',e=>e.stopPropagation());

function buildExDropdown(exchanges){
  allExchanges=exchanges;
  const drop=document.getElementById('exDrop');
  let html='<div class="ex-actions"><a id="exAll">All</a><a id="exNone">None</a></div>';
  exchanges.forEach(e=>{
    html+='<label><input type="checkbox" value="'+e+'" checked> '+e+'</label>';
  });
  drop.innerHTML=html;
  drop.querySelectorAll('input[type=checkbox]').forEach(cb=>{
    cb.addEventListener('change',()=>{
      if(cb.checked)selectedExchanges.add(cb.value);else selectedExchanges.delete(cb.value);
      updateExBtn();applyFilters();
    });
  });
  document.getElementById('exAll').addEventListener('click',()=>{
    selectedExchanges=new Set(allExchanges);
    drop.querySelectorAll('input[type=checkbox]').forEach(cb=>cb.checked=true);
    updateExBtn();applyFilters();
  });
  document.getElementById('exNone').addEventListener('click',()=>{
    selectedExchanges.clear();
    drop.querySelectorAll('input[type=checkbox]').forEach(cb=>cb.checked=false);
    updateExBtn();applyFilters();
  });
  selectedExchanges=new Set(allExchanges);
}

fetch('output/Latest.json').then(r=>r.json()).then(data=>{
  const exchanges=new Set();
  const quotes=new Set();
  document.getElementById('updated').textContent='Last updated: '+data.generated_at;

  allRows=data.pairs;
  allRows.forEach(r=>{
    r._distHTML=buildDistHTML(r.venues);
    r._exchanges=new Set(r.venues.map(v=>v.exchange));
    r._exchanges.forEach(e=>exchanges.add(e));
    quotes.add(r.quote_asset);
  });

  buildExDropdown([...exchanges].sort());
  const qtSel=document.getElementById('quoteFilter');
  [...quotes].sort().forEach(q=>{const o=document.createElement('option');o.value=q;o.textContent=q;qtSel.appendChild(o);});

  document.getElementById('loading').style.display='none';
  document.getElementById('tableWrap').style.display='block';
  document.getElementById('stats').innerHTML='Showing <b>'+allRows.length+'</b> of <b>'+allRows.length+'</b> pairs';
  filtered=allRows.slice();
  renderTable();
});
</script>
</body>
</html>
